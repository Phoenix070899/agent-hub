<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body, #t { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  .xterm .xterm-viewport { background-color: transparent !important; }
  :root {
    --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.875rem;
    --radius-1: 0.375rem; --size-find: 14rem; --text-find: 0.75rem;
  }
  #find {
    position: absolute; top: var(--space-2); right: var(--space-3); z-index: 10; padding: var(--space-1);
    background: var(--term-bg, Canvas); border: 1px solid var(--term-selection, GrayText); border-radius: var(--radius-1);
  }
  #find[hidden] { display: none; }
  #q {
    width: var(--size-find); box-sizing: border-box; padding: var(--space-1) var(--space-2);
    font: var(--text-find) system-ui, sans-serif;
    color: var(--term-fg, CanvasText); background: transparent; border: 0; outline: 0;
  }
</style>
<div id="t"></div>
<div id="find" hidden><input id="q" type="text" placeholder="Find" spellcheck="false" autocomplete="off"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="addon-web-links.js"></script>
<script src="addon-clipboard.js"></script>
<script src="addon-unicode11.js"></script>
<script src="addon-search.js"></script>
<script src="addon-webgl.js"></script>
<script>
  const post = m => webkit.messageHandlers.echo.postMessage(m);
  const term = new Terminal({
    allowProposedApi: true, // the Unicode version switch is still a proposed API
    allowTransparency: true,
    macOptionIsMeta: true,
    cursorBlink: false,
    scrollback: 5000,
  });
  const fit = new FitAddon.FitAddon();
  const search = new SearchAddon.SearchAddon();
  term.loadAddon(fit);
  term.loadAddon(search);
  term.loadAddon(new WebLinksAddon.WebLinksAddon((_, url) => post({ type: 'link', url })));
  // Programs may copy to the clipboard (OSC 52); none may read it.
  term.loadAddon(new ClipboardAddon.ClipboardAddon(undefined, {
    readText: async () => '',
    writeText: async (_, text) => post({ type: 'clipboard', text }),
  }));
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = '11';
  term.open(document.getElementById('t'));

  // The GPU renderer, unless an image shows through the pane: it cannot draw a clear background.
  let webgl = null;
  function useGpu(on) {
    if (on && !webgl) {
      try {
        webgl = new WebglAddon.WebglAddon();
        webgl.onContextLoss(() => { webgl.dispose(); webgl = null; });
        term.loadAddon(webgl);
      } catch (_) { webgl = null; }
    } else if (!on && webgl) {
      webgl.dispose();
      webgl = null;
    }
  }

  term.onData(data => post({ type: 'in', data }));
  term.onResize(({ cols, rows }) => post({ type: 'resize', cols, rows }));
  new ResizeObserver(() => fit.fit()).observe(document.getElementById('t'));

  // Matches are drawn in the theme's own colours, so they show whether or not the pane has focus.
  let findColors;
  const findOptions = extra => ({ ...extra, decorations: findColors });
  const find = document.getElementById('find');
  const query = document.getElementById('q');
  function openFind() { find.hidden = false; query.focus(); query.select(); }
  function closeFind() { find.hidden = true; search.clearDecorations(); term.focus(); }
  term.attachCustomKeyEventHandler(e => {
    if (e.type === 'keydown' && e.metaKey && e.key === 'f') { openFind(); return false; }
    return true;
  });
  query.addEventListener('input', () => search.findNext(query.value, findOptions({ incremental: true })));
  query.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeFind();
    else if (e.key === 'Enter') { e.shiftKey ? search.findPrevious(query.value, findOptions()) : search.findNext(query.value, findOptions()); }
  });

  const echo = {
    // `a`: { fontFamily, fontSize, transparent, theme: { background, foreground, cursor, selection, ansi[16] } }
    setAppearance(a) {
      const t = a.theme;
      const names = ['black', 'red', 'green', 'yellow', 'blue', 'magenta', 'cyan', 'white'];
      const colors = {};
      names.forEach((n, i) => { colors[n] = t.ansi[i]; colors['bright' + n[0].toUpperCase() + n.slice(1)] = t.ansi[i + 8]; });
      const root = document.documentElement.style;
      root.setProperty('--term-bg', t.background);
      root.setProperty('--term-fg', t.foreground);
      root.setProperty('--term-selection', t.selection);
      findColors = {
        matchBackground: t.selection, activeMatchBackground: t.cursor,
        matchOverviewRuler: t.selection, activeMatchColorOverviewRuler: t.cursor,
      };
      term.options.fontFamily = a.fontFamily;
      term.options.fontSize = a.fontSize;
      term.options.theme = {
        ...colors,
        // ds-allow-hardcode: a clear default background lets the image behind the pane show through
        background: a.transparent ? 'rgba(0, 0, 0, 0)' : t.background,
        foreground: t.foreground,
        cursor: t.cursor,
        selectionBackground: t.selection,
        selectionInactiveBackground: t.selection, // a match stays visible while the find bar has focus
      };
      useGpu(!a.transparent);
      fit.fit();
    },
    write(b64) { term.write(Uint8Array.from(atob(b64), c => c.charCodeAt(0))); },
    reset() { term.reset(); },
    focus() { term.focus(); },
    blur() { term.blur(); },
  };

  fit.fit();
  post({ type: 'ready', cols: term.cols, rows: term.rows });
</script>
