<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Echo: one solid square and its echoes. Ink #14213d, paper #fbfcfd, highlighter #ffe347. -->
  <defs>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14213d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#fbfcfd" stroke="#d5dbe4" stroke-width="6" filter="url(#drop)"/>
  <g fill="none" stroke="#14213d" stroke-width="14">
    <rect x="500" y="200" width="300" height="300" rx="72" stroke-opacity="0.14"/>
    <rect x="450" y="250" width="300" height="300" rx="72" stroke-opacity="0.22"/>
    <rect x="400" y="300" width="300" height="300" rx="72" stroke-opacity="0.32"/>
    <rect x="350" y="350" width="300" height="300" rx="72" stroke-opacity="0.45"/>
    <rect x="300" y="400" width="300" height="300" rx="72" stroke-opacity="0.62"/>
  </g>
  <rect x="224" y="476" width="324" height="324" rx="78" fill="#14213d"/>
  <rect x="420" y="672" width="72" height="72" rx="14" fill="#ffe347"/>
</svg>
