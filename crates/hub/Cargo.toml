[package]
name = "hub"
version = "0.1.0"
edition = "2021"
description = "Agent Hub: the Hub Daemon and the hub CLI"

[[bin]]
name = "hub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
vt100 = "0.16"
